# @package _global_

# train.py arguments
project_name: regress-lm-multi-task-reinforce
experiment_name: regress-lm-multi-task-reinforce-${now:%Y-%m-%d_%H-%M-%S}
use_wandb: false  # wandb
log_dir: logs
seed: 42
batch_size: 16  # batch sizeREINFORCE
num_epochs: 50  #
learning_rate: 1e-4
save_every_n_epochs: 5

# Step-based checkpoint saving
save_every_n_steps: 0 # checkpointnull0

# Learning rate scheduler
scheduler:
  type: cosine  # cosine, linear, constant
  warmup_steps: 50  # warmup
  min_lr_ratio: 0.1  # minimum learning rate as a ratio of initial lr

# Model parameters from train.py
model:
  max_input_len: 1024
  max_num_objs: 1
  d_model: 256
  num_encoder_layers: 3
  num_decoder_layers: 3
  nhead: 4
  dim_feedforward: 1024
  dropout: 0.1

# REINFORCE
reinforce:
  enabled: true
  temperature: 1.0  #
  num_samples: 8    #
  reward_scale: 1.0 # reward
  baseline_type: "mean"  # baseline'mean'  'min'
  weight: 0.5       # REINFORCE
  kl_weight: 0.1    # KL

# Dataset parameters
dataset:
  name: "1000-Cameras-Dataset"  #
  path:
    train: null
    val: null
  params:
    data_dir: regression_data

# /checkpoint
# -  model.pt
# -  model.pt
# -  checkpoint_*
init_checkpoint: null

# Other configurations
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

save_dir: outputs/multi-task-reinforce/${now:%Y-%m-%d}/${now:%H-%M-%S}/checkpoints
if_ntl: false
